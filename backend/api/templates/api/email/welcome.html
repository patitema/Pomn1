<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Добро пожаловать в POMNI</title>
  </head>
  <body style="margin:0;padding:0;background:#141414;color:#ffffff;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#141414;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#202020;border:1px solid #3b3b3b;border-radius:16px;">
            <tr>
              <td align="center" style="padding:32px 32px 16px;">
                <div style="font-size:32px;font-weight:700;line-height:1.1;color:#ffffff;">POMNI</div>
                <div style="margin-top:6px;font-size:16px;font-weight:700;color:#a9a9a9;">patitema BASE</div>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 32px;">
                <h1 style="margin:0 0 18px;font-size:24px;line-height:1.3;color:#ffffff;">Добро пожаловать, {{ username }}!</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#d8d8d8;">
                  Ваш аккаунт создан и готов к работе. Собирайте заметки, связывайте знания и планируйте задачи в одном пространстве.
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td style="border-radius:8px;background:#f1a6e8;">
                      <a href="{{ app_url }}" style="display:inline-block;padding:13px 22px;color:#171717;font-size:16px;font-weight:700;text-decoration:none;">Открыть POMNI</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:28px 0 0;font-size:13px;line-height:1.5;color:#999999;">
                  Если вы не регистрировались в POMNI, просто проигнорируйте это письмо.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
