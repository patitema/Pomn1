services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-pomni}_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-Pomni}
      MYSQL_USER: ${DB_USER:-pomni}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pomnipassword}
    volumes:
      - pomni_mysql_data:/var/lib/mysql
    expose:
      - "3306"
    networks:
      - pomni_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-pomni}_redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - noeviction
    expose:
      - "6379"
    networks:
      - pomni_network
    mem_limit: 64m
    cpus: "0.10"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-pomni}-backend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-pomni}_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-Pomni}
      - DB_USER=${DB_USER:-pomni}
      - DB_PASSWORD=${DB_PASSWORD:-pomnipassword}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,pomn1.ru,148.253.208.46}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,https://pomn1.ru}
      - DJANGO_SECURE_SSL_REDIRECT=${DJANGO_SECURE_SSL_REDIRECT:-False}
      - DJANGO_SECURE_PROXY_SSL_HEADER=${DJANGO_SECURE_PROXY_SSL_HEADER:-False}
      - DJANGO_SESSION_COOKIE_SECURE=${DJANGO_SESSION_COOKIE_SECURE:-False}
      - DJANGO_CSRF_COOKIE_SECURE=${DJANGO_CSRF_COOKIE_SECURE:-False}
      - DJANGO_SECURE_HSTS_SECONDS=${DJANGO_SECURE_HSTS_SECONDS:-0}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-False}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-mail.pomn1.ru}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
      - EMAIL_TIMEOUT=${EMAIL_TIMEOUT:-10}
      - "DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-POMNI <no-reply@pomn1.ru>}"
      - EMAIL_MESSAGE_ID_DOMAIN=${EMAIL_MESSAGE_ID_DOMAIN:-pomn1.ru}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:3000}
      - PASSWORD_RESET_TIMEOUT=${PASSWORD_RESET_TIMEOUT:-3600}
      - PASSWORD_RESET_IP_RATE=${PASSWORD_RESET_IP_RATE:-10/15m}
      - PASSWORD_RESET_EMAIL_RATE=${PASSWORD_RESET_EMAIL_RATE:-3/15m}
      - PASSWORD_RESET_TRUSTED_PROXY_COUNT=${PASSWORD_RESET_TRUSTED_PROXY_COUNT:-2}
      - LOGIN_IP_RATE=${LOGIN_IP_RATE:-10/15m}
      - LOGIN_USERNAME_RATE=${LOGIN_USERNAME_RATE:-5/15m}
      - CACHE_TABLE=${CACHE_TABLE:-pomni_cache}
      - WEB_PUSH_ENABLED=${WEB_PUSH_ENABLED:-False}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:support@pomni.ru}
      - WEB_PUSH_TIMEOUT=${WEB_PUSH_TIMEOUT:-10}
      - WEB_PUSH_VALIDATE_DNS=${WEB_PUSH_VALIDATE_DNS:-True}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pomni_network
    command: >
      sh -c "python manage.py wait_for_db --timeout 90 &&
             python manage.py migrate &&
             python manage.py createcachetable &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --timeout ${GUNICORN_TIMEOUT:-60} --access-logfile - --error-logfile -"

  celery-worker:
    image: ${COMPOSE_PROJECT_NAME:-pomni}-backend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-pomni}_celery_worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-Pomni}
      - DB_USER=${DB_USER:-pomni}
      - DB_PASSWORD=${DB_PASSWORD:-pomnipassword}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - WEB_PUSH_ENABLED=${WEB_PUSH_ENABLED:-False}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:support@pomni.ru}
      - WEB_PUSH_TIMEOUT=${WEB_PUSH_TIMEOUT:-10}
      - WEB_PUSH_VALIDATE_DNS=${WEB_PUSH_VALIDATE_DNS:-True}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pomni_network
    command: >
      sh -c "python manage.py wait_for_db --timeout 90 &&
             celery -A backend worker --loglevel=INFO --pool=solo --concurrency=1"
    mem_limit: 192m
    cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery-beat:
    image: ${COMPOSE_PROJECT_NAME:-pomni}-backend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-pomni}_celery_beat
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-Pomni}
      - DB_USER=${DB_USER:-pomni}
      - DB_PASSWORD=${DB_PASSWORD:-pomnipassword}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pomni_network
    command: >
      sh -c "python manage.py wait_for_db --timeout 90 &&
             celery -A backend beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule"
    mem_limit: 128m
    cpus: "0.10"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    container_name: ${COMPOSE_PROJECT_NAME:-pomni}_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-/api}
    depends_on:
      - backend
    networks:
      - pomni_network

networks:
  pomni_network:
    driver: bridge

volumes:
  pomni_mysql_data:
