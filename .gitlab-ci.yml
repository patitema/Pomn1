
stages:
  - lint
  - build
  - test

lint-frontend:
  stage: lint
  image: node:18
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cd frontend
    - npm ci
    - npx eslint src/ --max-warnings=0
  allow_failure: true

lint-backend:
  stage: lint
  image: python:3.11
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - pip install flake8
  script:
    - cd backend
    - flake8 api/ backend/ --max-line-length=120 --exclude=migrations,__pycache__
  allow_failure: true

build-frontend:
  stage: build
  image: node:18
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/build/
    expire_in: 1 week
  needs:
    - lint-frontend

build-backend:
  stage: build
  image: python:3.11
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - pip install -r backend/requirements.txt
  script:
    - cd backend
    - python manage.py check
  needs:
    - lint-backend

api-tests:
  stage: test
  image: postman/newman:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  services:
    - name: mysql:8.0
      alias: db
  variables:
    MYSQL_ROOT_PASSWORD: rootpassword
    MYSQL_DATABASE: Pomni
    MYSQL_USER: pomni
    MYSQL_PASSWORD: pomnipassword
    DB_HOST: db
    DB_NAME: Pomni
    DB_USER: pomni
    DB_PASSWORD: pomnipassword
  before_script:
    # Ждём пока MySQL поднимется
    - sleep 10
    # Запускаем бэкенд
    - cd backend
    - pip install -r requirements.txt
    - python manage.py migrate
    - python manage.py runserver 0.0.0.0:8000 &
    # Ждём пока Django поднимется
    - |
      for i in $(seq 1 30); do
        if curl -s http://localhost:8000/api/register/ > /dev/null 2>&1; then
          echo "Backend is ready"
          break
        fi
        echo "Waiting for backend... ($i)"
        sleep 2
      done
  script:
    - newman run tests/api/postman-collection.json --env-var baseUrl=http://localhost:8000/api --bail
  needs:
    - build-backend
  allow_failure: false

frontend-tests:
  stage: test
  image: node:18
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cd frontend
    - npm ci
    - npm test -- --watchAll=false --passWithNoTests
  needs:
    - build-frontend
  allow_failure: true
